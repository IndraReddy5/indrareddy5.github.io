<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/endark.css" />
  <link rel="stylesheet" href="/css/custom.css" />
  <script>
    // apply saved theme before paint to avoid flash
    if (localStorage.getItem("theme") === "light") {
      document.documentElement.setAttribute("data-theme", "light");
    }
  </script>
</head>
<body>

  <header class="ed-topbar">
    <a href="/" class="ed-topbar-logo">Indra Reddy</a>
    <div style="display: flex; align-items: center; gap: var(--ed-space-lg);">
      <nav class="ed-topbar-nav" id="main-nav">
        {{ range .Site.Menus.main }}
          <a href="{{ .URL }}" class="ed-topbar-link{{ if eq $.RelPermalink .URL }} active{{ end }}"
            {{ if strings.HasSuffix .URL ".pdf" }}target="_blank" rel="noopener"{{ end }}>
            {{ .Name }}
          </a>
        {{ end }}
      </nav>
      <button id="theme-toggle" aria-label="Toggle light/dark mode" onclick="toggleTheme()">
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <line x1="12" y1="2" x2="12" y2="4"/>
          <line x1="12" y1="20" x2="12" y2="22"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="2" y1="12" x2="4" y2="12"/>
          <line x1="20" y1="12" x2="22" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none; transform: rotate(-5deg);">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <button id="menu-toggle" class="menu-toggle" aria-label="Toggle menu" aria-expanded="false" onclick="toggleMenu()">
        <svg id="icon-hamburger" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
        <svg id="icon-close" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="display:none;">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer style="width: 100%; border-top: 1px solid var(--ed-color-border);">
    <div class="ed-footer" style="max-width: 860px; margin: 0 auto; padding: 1.25rem var(--ed-space-xl); border-top: none;">
      <div style="display: flex; flex-direction: column; gap: 0.25rem;">
        <span class="ed-footer-text">&copy; {{ now.Format "2006" }} {{ .Site.Params.author.name }}</span>
        <span style="font-size: 0.6875rem; color: var(--ed-color-text-faint);">
          Built with <a href="https://gohugo.io" class="ed-footer-link" target="_blank" rel="noopener">Hugo</a> &middot; Styled with <a href="https://github.com/kashifulhaque/endark" class="ed-footer-link" target="_blank" rel="noopener">endark</a> by <a href="https://github.com/kashifulhaque" class="ed-footer-link" target="_blank" rel="noopener">Kashiful Haque</a>
        </span>
      </div>
      <div class="ed-footer-links">
        <a href="https://github.com/IndraReddy5" class="ed-footer-link" target="_blank" rel="noopener">GitHub</a>
        <a href="https://www.linkedin.com/in/indrareddyguvva/" class="ed-footer-link" target="_blank" rel="noopener">LinkedIn</a>
      </div>
    </div>
  </footer>

  <script>
    function setIcons(isLight) {
      document.getElementById("icon-sun").style.display  = isLight ? "none"  : "block";
      document.getElementById("icon-moon").style.display = isLight ? "block" : "none";
    }

    function toggleTheme() {
      const isLight = document.documentElement.getAttribute("data-theme") === "light";
      if (isLight) {
        document.documentElement.removeAttribute("data-theme");
        localStorage.setItem("theme", "dark");
        setIcons(false);
      } else {
        document.documentElement.setAttribute("data-theme", "light");
        localStorage.setItem("theme", "light");
        setIcons(true);
      }
    }

    // apply correct icon on load
    setIcons(localStorage.getItem("theme") === "light");

    function toggleMenu() {
      var nav = document.getElementById("main-nav");
      var btn = document.getElementById("menu-toggle");
      var open = nav.classList.toggle("open");
      btn.setAttribute("aria-expanded", String(open));
      document.getElementById("icon-hamburger").style.display = open ? "none" : "block";
      document.getElementById("icon-close").style.display = open ? "block" : "none";
    }

    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll("#main-nav .ed-topbar-link").forEach(function (link) {
        link.addEventListener("click", function () {
          document.getElementById("main-nav").classList.remove("open");
          document.getElementById("menu-toggle").setAttribute("aria-expanded", "false");
          document.getElementById("icon-hamburger").style.display = "block";
          document.getElementById("icon-close").style.display = "none";
        });
      });
    });
  </script>

</body>
</html>
